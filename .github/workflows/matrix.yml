#nojs 
name: This pipeline will deploy to multiple env

on:
  workflow_dispatch
  
jobs:
  deploy:
    name: Deploy to multiple environments
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - dev
          - qa
          - prod
          - preprod
          - dev1 
          - dev2 

    steps:
      - name: Deploy to each environment
        run: echo "Running deployment on ${{ matrix.environment }}"
