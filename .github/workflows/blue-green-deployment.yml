#nojs
name: Deploying the appliction for blue green deployment with echo testing example 

on:
  push:
    branches:
      - main

jobs:
  blue:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on blue 1
        run: echo "Deploying on blue server1 "
      
      - name: Deploy on blue 2
        run: echo "Deploying on blue server2 "

  green:
    runs-on: ubuntu-latest
    needs: blue

    steps:  
      - name: Deploy on green 1
        run: echo "Deploying on green server1 "
      
      - name: Deploy on green 2
        run: echo "Deploying on green server2"